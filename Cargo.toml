[workspace]
members = [
    "crates/kafkaman-config",
    "crates/kafkaman-core",
    "crates/kafkaman-sqlx",
    "crates/kafkaman-worker",
    "crates/kafkaman-rdkafka",
    "crates/kafkaman-axum",
    "crates/kafkaman-test",
    "crates/kafkaman",
    "crates/kafkaman-otel",
    "examples/contracts",
    "examples/order",
    "examples/product",
    "examples/provision",
    "tests/durable-send",
    "tests/distributed-cache",
    "tests/observability",
    "tests/otlp-capture",
    "tests/example-telemetry",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nicolasmartino/kafkaman"

[workspace.dependencies]
async-trait = "0.1"
axum = "0.8"
# Default features off, and every crate below enables exactly the one axis it
# uses: `kafkaman-core` the trace API, `kafkaman-worker` and `kafkaman-rdkafka`
# the metrics API. Cargo features are additive and a host cannot subtract one,
# so a library that enables `trace` for a metrics-only build has widened that
# build's graph permanently — the default set also drags in `logs`, `futures`
# and `thiserror`. Nothing is lost by narrowing: a host that installs the SDK
# gets `trace`, `metrics`, `logs` and `internal-logs` back through
# `opentelemetry_sdk`'s own defaults, and a host that wants OpenTelemetry's
# internal diagnostics without the SDK can add the feature itself.
opentelemetry = { version = "0.32", default-features = false }
# The host owns the pipeline, so the SDK and the exporter stay out of every
# crate an adopter reaches through the `kafkaman` facade. The one exception is
# `crates/kafkaman-otel`, whose entire job is to hold them: it is a leaf nothing
# in the workspace depends on but the example binaries, which is what keeps the
# boundary checkable rather than merely stated. `just opt-out` asserts both
# halves. The observability suite adds the `testing` feature on top of this.
# See wiki/decisions/telemetry-pipeline-ownership.decision.md and its
# 2026-08-27 amendment.
opentelemetry_sdk = { version = "0.32", features = ["metrics", "trace", "logs"] }
# Attribute-key constants only: no runtime, no SDK, so a library crate may
# depend on it. The messaging keys kafkaman emits are still experimental
# upstream, which is what the feature gates.
opentelemetry-semantic-conventions = { version = "0.32", features = ["semconv_experimental"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["metrics", "trace", "logs", "http-proto", "reqwest-blocking-client"] }
# The API-side bridge between `tracing` spans and OpenTelemetry. Pulls the
# `opentelemetry` API crate and `tracing-subscriber`, and no SDK — which is what
# lets a library crate depend on it. 0.33 is the release paired with
# `opentelemetry` 0.32.
# Default features off: they add `tracing-log` and a `MetricsLayer` this
# workspace never builds. `kafkaman-core` wants exactly one thing from this
# crate — the span bridge behind `OpenTelemetrySpanExt` — and the narrower the
# library crates' graph is, the less an adopter inherits for turning `traces` on.
tracing-opentelemetry = { version = "0.33", default-features = false }
# The `tracing` -> OpenTelemetry *logs* bridge. Application-side only: it needs a
# LoggerProvider, which is SDK.
opentelemetry-appender-tracing = "0.32"
rdkafka = { version = "0.36", features = ["tokio"] }
rand = "0.8"
# HTTP client for the distributed-cache test, which drives both example services
# over real sockets and never touches their databases. `default-features = false`
# drops the TLS stacks: the test dials loopback.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
testcontainers = "0.27.3"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "time", "json"] }
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["uuid"] }
# `vendored` keeps the Swagger UI assets inside the crate, so the container build
# stays offline — the default behaviour otherwise fetches the bundle at build
# time, which would fail in a sandboxed or air-gapped image build.
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }

# Enforced by `just check` and CI. These are the lints that catch the classes of
# bug this codebase actually hit: silently discarded Results, panics on a library
# path, and undocumented public surface on a crate that maintains compatibility
# notes.
[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Panicking paths: a library must return errors, not abort the caller's process.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
# Correctness and clarity.
todo = "deny"
dbg_macro = "deny"
await_holding_lock = "deny"
inefficient_to_string = "warn"
redundant_clone = "warn"
