[workspace]
members = [
    "crates/kafkaman-config",
    "crates/kafkaman-core",
    "crates/kafkaman-sqlx",
    "crates/kafkaman-worker",
    "crates/kafkaman-rdkafka",
    "crates/kafkaman-test",
    "crates/kafkaman",
    "apps/axum-outbox",
    "tests/durable-send",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nicolasmartino/kafkaman"

[workspace.dependencies]
async-trait = "0.1"
axum = "0.8"
rdkafka = { version = "0.36", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "time", "json"] }
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4", "v7"] }
