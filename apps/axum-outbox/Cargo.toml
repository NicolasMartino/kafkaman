[package]
name = "axum-outbox"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum.workspace = true
# One kafkaman dependency, not two: the transport comes through the facade.
kafkaman = { path = "../../crates/kafkaman", features = ["rdkafka"] }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
# The PostgreSQL testcontainer helper, shared rather than copied: this file
# used to restate it, labels and all.
durable-send-tests = { path = "../../tests/durable-send" }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
