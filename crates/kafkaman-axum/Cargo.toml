[package]
name = "kafkaman-axum"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum.workspace = true
# Default-off for the same reason as `kafkaman-config`: an internal dependency
# that asks for `traces` re-enables it for every crate in the graph. The admin
# routes emit through `tracing` alone and need no OpenTelemetry types.
kafkaman-core = { path = "../kafkaman-core", default-features = false }
kafkaman-sqlx = { path = "../kafkaman-sqlx", default-features = false }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower.workspace = true
tracing.workspace = true
uuid.workspace = true

[lints]
workspace = true
