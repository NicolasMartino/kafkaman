[package]
name = "kafkaman-axum"
version = "0.1.0"
description = "Axum integration for kafkaman: request correlation middleware and read-only operator routes"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
axum.workspace = true
# Default-off for the same reason as `kafkaman-config`: an internal dependency
# that asks for `traces` re-enables it for every crate in the graph. The admin
# routes emit through `tracing` alone and need no OpenTelemetry types.
kafkaman-core = { path = "../kafkaman-core", version = "0.1.0", default-features = false }
kafkaman-sqlx = { path = "../kafkaman-sqlx", version = "0.1.0", default-features = false }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
time.workspace = true
tokio.workspace = true
tower.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# Test-only, and deliberately not a dependency: the host owns the subscriber, so
# this crate must never install one. It is here so the route-cardinality tests
# can read the fields the span actually recorded rather than trusting the code
# that wrote them.
tracing-subscriber.workspace = true

[lints]
workspace = true
