[package]
name = "kafkaman-config"
version = "0.1.0"
description = "Loading and validating kafkaman.toml, accumulating every problem in one pass"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# `default-features = false` is load-bearing, not tidiness. Cargo unifies
# features across the graph, so this crate asking for the default `traces`
# puts `opentelemetry` back into a `kafkaman --no-default-features` build —
# the opt-out `kafkaman/Cargo.toml` advertises. Nothing here touches the
# trace API; it needs the config vocabulary only.
kafkaman-core = { path = "../kafkaman-core", version = "0.1.0", default-features = false }
serde.workspace = true
thiserror.workspace = true
toml.workspace = true

[lints]
workspace = true
