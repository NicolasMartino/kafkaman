[package]
name = "kafkaman-rdkafka"
version = "0.1.0"
description = "Kafka transport for kafkaman: publishing claimed outbox rows, durable ingest, and topic convergence"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["metrics", "traces"]
internal-hooks = []
# OpenTelemetry counters for publish and ingest. On by default; opt out to drop
# the `opentelemetry` dependency entirely.
metrics = ["dep:opentelemetry", "dep:opentelemetry-semantic-conventions", "kafkaman-worker/metrics"]
# W3C trace context capture and span parenting. On by default; opt out to build
# without an `opentelemetry` dependency at all. Stored context is still read and
# forwarded either way, so turning this off stops this process from producing
# trace context without breaking propagation for the services around it.
traces = ["kafkaman-core/traces", "kafkaman-sqlx/traces", "kafkaman-worker/traces"]

[dependencies]
async-trait.workspace = true
# `default-features = false` is defensive rather than load-bearing:
# `kafkaman-config` declares no features today, and the guard that keeps
# `opentelemetry` out of a facade opt-out build is its own
# `kafkaman-core = { default-features = false }` pin. `just opt-out` is what
# proves that, not this line.
kafkaman-config = { path = "../kafkaman-config", version = "0.1.0", default-features = false }
kafkaman-core = { path = "../kafkaman-core", version = "0.1.0", default-features = false }
kafkaman-sqlx = { path = "../kafkaman-sqlx", version = "0.1.0", default-features = false }
kafkaman-worker = { path = "../kafkaman-worker", version = "0.1.0", default-features = false }
# Metrics only, for the same reason as `kafkaman-worker`: the publish and
# ingest spans are built through `kafkaman-core`'s verb API, which needs no
# OpenTelemetry type here.
opentelemetry = { workspace = true, optional = true, features = ["metrics"] }
opentelemetry-semantic-conventions = { workspace = true, optional = true }
rdkafka.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

[lints]
workspace = true
