[package]
name = "kafkaman-sqlx"
version = "0.1.0"
description = "PostgreSQL persistence for kafkaman: migrations, outbox, received tables, dispatch, and entity caches"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["traces"]
internal-hooks = []
# W3C trace context capture and span parenting. On by default; opt out to build
# without an `opentelemetry` dependency at all. Stored context is still read and
# forwarded either way, so turning this off stops this process from producing
# trace context without breaking propagation for the services around it.
traces = ["kafkaman-core/traces"]

[dependencies]
kafkaman-config = { path = "../kafkaman-config", version = "0.1.0" }
kafkaman-core = { path = "../kafkaman-core", version = "0.1.0", default-features = false }
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tracing.workspace = true
time.workspace = true
uuid.workspace = true

[dev-dependencies]
# The pool-size guard in `migrate` is checked before anything connects, so it is
# a unit test rather than an integration one — but `migrate` is still async.
tokio = { workspace = true }

[lints]
workspace = true
