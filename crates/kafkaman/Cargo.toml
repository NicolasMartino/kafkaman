[package]
name = "kafkaman"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["metrics", "traces"]
# Reusable Axum admin/health routes and request correlation middleware.
#
# `dep:axum` alongside the obvious `dep:kafkaman-axum`: the facade declares a
# `pub mod axum` of its own, so `src/axum.rs` has to name the crate as
# `::axum` to disambiguate, and a leading `::` resolves only against a direct
# dependency. It costs nothing in the graph — `kafkaman-axum` already pulls
# the same workspace-pinned `axum` in.
axum = ["dep:axum", "dep:kafkaman-axum"]
# Links librdkafka; opt in when the application publishes or consumes.
#
# `RuntimeBuilder` lives behind this feature rather than beside it: assembling a
# runtime means constructing a publisher, a consumer, and a topic admin, so a
# builder without the transport would be a builder that cannot build anything.
rdkafka = ["dep:kafkaman-rdkafka"]
# OpenTelemetry counters from the worker loops and Kafka transport. On by
# default; opt out to build without an `opentelemetry` dependency.
#
# "Without an `opentelemetry` dependency" is a claim about the dependency graph,
# not about this file, and Cargo will not enforce it: every internal dependency
# below carries `default-features = false` for that reason, and `just opt-out`
# asserts the result. One sibling crate asking for the default `traces` puts
# `opentelemetry` back into a `--no-default-features` build with nothing failing
# to compile.
metrics = ["kafkaman-worker/metrics", "kafkaman-rdkafka?/metrics"]
# W3C trace context capture and span parenting. On by default; opt out to build
# without an `opentelemetry` dependency at all. Stored context is still read and
# forwarded either way, so turning this off stops this process from producing
# trace context without breaking propagation for the services around it.
traces = [
    "kafkaman-core/traces",
    "kafkaman-sqlx/traces",
    "kafkaman-worker/traces",
    "kafkaman-rdkafka?/traces",
]

[dependencies]
axum = { workspace = true, optional = true }
kafkaman-axum = { path = "../kafkaman-axum", optional = true }
kafkaman-config = { path = "../kafkaman-config" }
kafkaman-core = { path = "../kafkaman-core", default-features = false }
kafkaman-rdkafka = { path = "../kafkaman-rdkafka", optional = true, default-features = false }
kafkaman-sqlx = { path = "../kafkaman-sqlx", default-features = false }
kafkaman-worker = { path = "../kafkaman-worker", default-features = false }
serde.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
# Test-only, and deliberately not a dependency: the host owns the subscriber, so
# this crate must never install one. It is here so the span-tier test can read
# which spans a given `EnvFilter` actually opened.
tracing-subscriber.workspace = true

[lints]
workspace = true
