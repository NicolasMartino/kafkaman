# vocabulary, not a transport. Each service turns the feature on for itself.
kafkaman = { path = "../../crates/kafkaman" }
serde.workspace = true
uuid.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
