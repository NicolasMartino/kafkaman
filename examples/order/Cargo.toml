[package]
name = "example-order"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "order"
path = "src/main.rs"

[lib]
name = "example_order"
path = "src/lib.rs"

[dependencies]
axum.workspace = true
example-contracts = { path = "../contracts" }
# One kafkaman dependency, not two: the transport comes through the facade.
kafkaman = { path = "../../crates/kafkaman", features = ["axum", "rdkafka"] }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
utoipa-swagger-ui.workspace = true
uuid.workspace = true

[dev-dependencies]
# `testcontainers` directly rather than the shared `durable-send-tests` helper.
# The merge brought that swap over from `apps/axum-outbox`, which this package
# replaced — it was made for a test file that no longer exists, and an example
# should not reach into the library's own test-support crate to run.
testcontainers.workspace = true
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
