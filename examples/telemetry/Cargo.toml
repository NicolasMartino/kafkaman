[package]
name = "example-telemetry"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

# The OpenTelemetry SDK and the OTLP exporter live here rather than in either
# service, and deliberately never in `crates/`: the host owns the pipeline, and
# an example app is a host. See
# wiki/decisions/telemetry-pipeline-ownership.decision.md.
[dependencies]
opentelemetry.workspace = true
opentelemetry-appender-tracing.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
