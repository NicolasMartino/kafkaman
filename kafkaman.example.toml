# kafkaman.example.toml
#
# Copy to kafkaman.toml at deploy time after CI/CD has rendered environment
# specific secrets. The running process reads one already-resolved file; there
# are no profiles, overlays, or environment-name sections.
#
# Every knob kafkaman reads is listed here. Sections are marked REQUIRED or
# OPTIONAL; an unknown key inside a kafkaman-owned section is a hard error, not a
# warning, so a typo fails at boot rather than silently taking a default.
#
# Durations are `<integer><unit>` with unit one of: ms, s, m, h, d.

# REQUIRED.
[database]
# Postgres schema owning kafkaman's tables, migration history, and advisory lock.
# Must be a valid lowercase SQL identifier.
schema = "kafkaman"
#
# `url` is host-owned sample context, NOT consumed by kafkaman. The example
# services (examples/order, examples/product) read their Postgres connection
# string from the DATABASE_URL environment variable, so this value is ignored if
# you set it here.
# url = "postgres://user:password@localhost:5432/app"

# `[kafka].brokers` is likewise host-owned: the example services read
# KAFKA_BROKERS from the environment. Kept here only to document the expected
# shape; it is not part of kafkaman's config contract and is ignored if set.
# [kafka]
# brokers = "localhost:9092"

# OPTIONAL. How boot should reconcile registered entity topics with the broker.
# Absent means `verify`, not "skip". `verify` reads the broker's topic
# configuration and refuses to start on a missing or non-compacted topic.
# `create` creates topics that are missing; an existing topic with the wrong
# cleanup policy still fails boot rather than being repaired in place. `off`
# disables topic checks and leaves all responsibility with the host deployment.
[topics]
mode = "verify"

# REQUIRED. Drives the outbox relay: how it claims rows, how long it owns them,
# and how fast it polls. Every key below is mandatory — there are no defaults.
[relay]
# Identity written to `claimed_by`. Make it unique per process so an operator can
# tell which worker holds a lease.
worker_id = "orders-relay-1"
# Rows claimed per cycle. Must be > 0. Bounds how much one relay cycle publishes
# before marking results.
batch_limit = 100
# How long a claim is owned before another worker may steal it. Must be > 0. Set
# above your worst-case publish latency, or a slow publish gets its row reclaimed
# and published twice.
lease_for = "30s"
# Delay before retrying a row whose publish failed. May be 0, meaning retry on
# the next cycle.
retry_after = "1s"
# Sleep between cycles when there is nothing to claim. Must be > 0; zero would
# spin against the database.
poll_interval = "250ms"

# OPTIONAL. Governs *receive-side* dispatch retries and the DLQ. Omit the whole
# section to accept the defaults shown in each comment.
[retry.defaults]
# Dispatch attempts before a row goes terminal `Failed`. Must be >= 1.
# Default 10.
max_attempts = 5
# Delay before the first retry. Must be > 0 — a zero backoff makes a permanently
# failing row spin against the database. Default 1s.
initial_backoff = "500ms"
# Ceiling on the exponential delay. Must be >= initial_backoff. Default 300s.
max_backoff = "30s"
# Growth factor per attempt. Must be finite and >= 1.0. Actual delays carry equal
# jitter, landing in [delay/2, delay], so a shared outage does not retry the whole
# backlog in lockstep. Default 2.0.
multiplier = 2.0
# Failures retained per row in the `errors` audit trail. Oldest are dropped past
# this. Must be >= 1. Default 20.
errors_limit = 16
# Where exhausted rows land. Only "table" is supported: the row stays put with
# status `Failed`, inspectable via `received_failed_rows`. Default "table".
dlq = "table"

# OPTIONAL, repeatable. Per-message-type overrides, merged over `[retry.defaults]`.
# Every key is optional — omit one to inherit. The message type must be registered
# with `ResolvedConfig`, or boot fails; this catches a renamed type whose retry
# policy would otherwise be silently ignored.
# Every key is spelled out here to show the full override surface; a real config
# would list only the ones it changes. See `[retry.defaults]` above for what each
# means and what it defaults to.
[retry.messages.order_snapshot]
max_attempts = 8
initial_backoff = "250ms"
max_backoff = "60s"
multiplier = 1.5
errors_limit = 32
dlq = "table"

# OPTIONAL. Governs kafkaman's tracing events, OpenTelemetry metric warning
# thresholds, and admin-route stuck/age detection. Omit the whole section to use
# quiet production defaults. The host application still owns the tracing
# subscriber and OpenTelemetry exporter; kafkaman only emits telemetry.
[observability.defaults]
# RESERVED. Parsed and validated, but nothing reads it yet: kafkaman emits through
# `tracing` and your subscriber owns filtering, so use an EnvFilter directive on the
# `kafkaman` targets today. Accepted: error, warn, info, debug, trace. Default warn.
level = "warn"
# LIVE. "summary" logs once per scheduler cycle. "per-message" additionally emits one
# event per successful message, at the `sample_success` rate below. Default summary.
lifecycle = "summary"
# RESERVED. No kafkaman code path emits payload bodies, so this is "off" in effect
# whatever you set. Accepted now so adding a redaction hook is not a breaking config
# change. Accepted: off, redacted, sampled, full. Default off.
payload = "off"
# RESERVED. Same status as `payload`: no code path emits arbitrary user headers today.
# Accepted: off, kafkaman-only, all. Default kafkaman-only.
headers = "kafkaman-only"
# LIVE. How consumer ingest spans relate to a propagated Kafka producer context.
# "linked" follows OpenTelemetry messaging semantics and is batch-safe. "parented"
# is an opt-in for single-record flows where your backend should draw one
# distributed waterfall across the broker hop. Default linked.
kafka_trace_handoff = "linked"
# LIVE, and only meaningful with lifecycle = "per-message". Fraction of successes that
# get an event. Sampling is deterministic and proportional, not random: after N
# successes exactly floor(N * sample_success) events have been emitted — never more than
# the rate allows, and never a whole event behind it — so 0.25 costs a quarter of the
# volume rather than something near it. Must be 0.0..=1.0. Default 0.0, which is
# silent.
sample_success = 0.0
# LIVE. How long an expired claim or overdue received row must stay overdue before the
# stuck-row route reports it. Must be > 0. Default 60s.
stuck_after = "60s"
# LIVE. Age at which queued work sets `over_max_queue_age` on a depth summary. Terminal
# rows never set it — a published row awaiting retention is not a backlog. Must be > 0.
# Default 5m.
max_queue_age = "5m"

# OPTIONAL, repeatable. Per-message-type overrides, merged over
# `[observability.defaults]`. The message type must be registered with
# `ResolvedConfig`, or boot fails.
[observability.messages.order_snapshot]
# An event per successful message for this type...
lifecycle = "per-message"
# ...one in every twenty of them.
sample_success = 0.05
# A high-value stream should be reported overdue sooner.
stuck_after = "30s"

# OPTIONAL. How the receive dispatcher paces itself and when it gives up. Every
# field has a default, so omitting the section gives exactly the behaviour that
# predates it.
#
# Separate from [retry], which is otherwise the receive-dispatch section, because
# [retry] is per message type and these are per loop. One dispatcher covers one
# message type, so there is no meaningful sense in which one type could poll on a
# different interval than another.
[dispatcher]
# Sleep between polls that found nothing due. Must be > 0; it is the only thing
# that yields between empty polls, so zero is a busy spin against the database.
# Defaults to `relay.poll_interval`, which is where the dispatcher read it before
# this section existed.
poll_interval = "250ms"
# Distinct received rows that may panic in their handler, consecutively, before
# the dispatcher stops with `ConsecutivePanickingRowLimitExceeded`. Must be > 0;
# there is no way to spell "never stop", because a handler panicking on every row
# is not something to retry in silence. Default 10.
#
# DISTINCT ROWS, not panics. A single poison message panicking through its whole
# retry budget is exactly what the budget and the dead-letter queue are for and
# never trips this, however many attempts it takes. What trips it is a deploy
# whose handler fails on everything, which no retry budget can absorb. A row that
# gets through clears the streak.
#
# The streak is also ordinal rather than wall-clock: only a cycle that claims a
# row and does not panic clears it, so ten panics spread over ten months trip
# this exactly as ten in one second would. Raise the limit on a queue idle enough
# for that to be the wrong reading.
max_consecutive_panicking_rows = 10

# OPTIONAL. Reclaims terminal outbox rows. Omit the section and nothing is ever
# deleted — the outbox grows for the life of the application, which is the
# historical behaviour. With `RuntimeBuilder`, a configured published role starts
# its purger automatically only in the default/all topology or when
# `Subsystems::PURGE` is selected. Low-level users must run
# `kafkaman_worker::run_purger` themselves.
#
# Scope is the outbox alone, and deliberately so. Received tables are the only
# durable record of what was done, and their dedupe window *is* their retention
# window — purging a processed row lets a Kafka redelivery re-run the handler.
# Cache tables are the state. The schema-wide `received_ingest_failures`
# quarantine is also retained: it is the only durable diagnosis for records
# skipped before a received row existed. See
# wiki/decisions/outbox-retention-policy.decision.md.
[retention]
# Age past which a terminal outbox row is reclaimable, measured from `created_at`
# against the database clock. Must be > 0; zero would delete rows the instant they
# publish, destroying the record while an incident is still being diagnosed.
# Default 7d.
outbox_after = "7d"
# Rows deleted per batch. Must be > 0. Bounds how long one delete holds locks and
# how much write-ahead log it generates; unbounded deletes over a large outbox are
# the outage retention exists to prevent. Default 1000.
batch_size = 1000
# Sleep between sweeps once a batch comes back empty. Must be > 0. Sweeps run
# back-to-back while batches are full, so a backlog drains at full speed.
# Default 60s.
poll_interval = "60s"
# Whether to reclaim `Failed` rows too. Default false: they are the invalid-send
# audit trail, and unlike every other terminal row nothing else records that the
# work was rejected.
include_failed = false
