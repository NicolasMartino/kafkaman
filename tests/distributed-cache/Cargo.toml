[package]
name = "distributed-cache-tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Deliberately no dependency on `example-contracts`: this test speaks the
# services' HTTP/JSON surface, not their Kafka contract, so it cannot compile
# against a shape only the wire has.
example-order = { path = "../../examples/order" }
example-product = { path = "../../examples/product" }
# The real provisioner, not a reimplementation of it. The fixture builds the
# environment the same way `examples/compose.yaml` does, so a change to what
# provisioning means reaches this test rather than passing it by.
example-provision = { path = "../../examples/provision" }
# `rdkafka` named explicitly rather than left to feature unification with
# `example-order`: this crate reads topic configuration off the broker itself,
# and a dependency that only compiles because a sibling happened to enable a
# feature is one refactor away from breaking.
kafkaman = { path = "../../crates/kafkaman", features = ["rdkafka"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
# A dependency rather than a dev-dependency: `src/lib.rs` owns the containers and
# the two-service fixture that the integration tests drive.
testcontainers.workspace = true
tokio.workspace = true
uuid.workspace = true

[lints]
workspace = true
