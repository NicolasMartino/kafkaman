[package]
name = "durable-send-tests"
version = "0.1.0"
# Workspace-internal: an example or an integration-test package, never shipped.
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Opt-in full-loop gate: publishes through RdkafkaPublisher to a real Redpanda
# broker started as a testcontainer and asserts the consumed record.
redpanda = [
    "kafkaman-test/redpanda",
    "dep:kafkaman-rdkafka",
    "dep:rdkafka",
]

[dependencies]
kafkaman-config = { path = "../../crates/kafkaman-config" }
kafkaman-core = { path = "../../crates/kafkaman-core" }
kafkaman-sqlx = { path = "../../crates/kafkaman-sqlx" }
kafkaman-rdkafka = { path = "../../crates/kafkaman-rdkafka", optional = true }
kafkaman-test = { path = "../../crates/kafkaman-test" }
kafkaman-worker = { path = "../../crates/kafkaman-worker" }
rdkafka = { workspace = true, optional = true }
serde.workspace = true
sqlx.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
# A dependency rather than a dev-dependency: `src/lib.rs` owns the shared
# container that every integration test in this package reuses.
testcontainers.workspace = true

[dev-dependencies]
async-trait.workspace = true
serde_json.workspace = true

[lints]
workspace = true
