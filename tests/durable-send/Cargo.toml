[package]
name = "durable-send-tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Opt-in full-loop gate: publishes through RdkafkaPublisher to a real Redpanda
# broker started as a testcontainer and asserts the consumed record.
redpanda = [
    "kafkaman-test/redpanda",
    "dep:kafkaman-rdkafka",
    "kafkaman-rdkafka/test-hooks",
    "dep:rdkafka",
]

[dependencies]
kafkaman-config = { path = "../../crates/kafkaman-config" }
kafkaman-core = { path = "../../crates/kafkaman-core" }
kafkaman-sqlx = { path = "../../crates/kafkaman-sqlx", features = ["test-hooks"] }
kafkaman-rdkafka = { path = "../../crates/kafkaman-rdkafka", optional = true }
kafkaman-test = { path = "../../crates/kafkaman-test" }
kafkaman-worker = { path = "../../crates/kafkaman-worker" }
rdkafka = { workspace = true, optional = true }
serde.workspace = true
sqlx.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true

[dev-dependencies]
async-trait.workspace = true
serde_json.workspace = true
testcontainers = "0.27.3"
