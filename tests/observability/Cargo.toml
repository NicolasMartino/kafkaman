[package]
name = "observability-tests"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Opt-in, like the durable-send suite's gate of the same name: the ingest
# instruments can only be observed against a real broker, because there is no
# ingest cycle without one.
redpanda = ["durable-send-tests/redpanda", "dep:kafkaman-rdkafka", "dep:rdkafka"]

[dependencies]
kafkaman-axum = { path = "../../crates/kafkaman-axum" }
kafkaman-core = { path = "../../crates/kafkaman-core" }
# Carried for one assertion: the companion crate names the exception target it
# filters, and cannot import it, because it deliberately does not depend on
# kafkaman. This suite depends on both and is where the two are held equal.
kafkaman-otel = { path = "../../crates/kafkaman-otel" }
kafkaman-rdkafka = { path = "../../crates/kafkaman-rdkafka", optional = true }
kafkaman-sqlx = { path = "../../crates/kafkaman-sqlx" }
kafkaman-test = { path = "../../crates/kafkaman-test" }
kafkaman-worker = { path = "../../crates/kafkaman-worker" }
# The container scaffolding and message fixtures are shared with the durable-send
# suite rather than duplicated. `postgres_for_suite` takes a suite label for
# exactly this reason, so a stray container still points at the binary that
# started it. If a third suite appears, this scaffolding should move to
# `kafkaman-test` instead of being depended on sideways.
durable-send-tests = { path = "../durable-send" }
async-trait.workspace = true
opentelemetry.workspace = true
rdkafka = { workspace = true, optional = true }
# `testing` on top of the workspace features: `InMemoryMetricExporter` lives
# there, and no non-test member should carry it.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
# Exporters live in `examples/` and `tests/` and nowhere else, per
# wiki/decisions/telemetry-pipeline-ownership.decision.md. This suite is the
# `tests/` half: it is where "kafkaman's telemetry reaches the wire" is proved,
# independent of whichever example currently ships.
opentelemetry-otlp.workspace = true
opentelemetry-appender-tracing.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
axum.workspace = true
# Raw SQL, for the one test that has to write a value the constructor refuses:
# a `traceparent` column holding something that is not a `traceparent` can only
# be produced by going past the type that guards it.
sqlx.workspace = true
# The OTLP wire types, so `otlp_wire` can decode what it captured instead of
# searching the protobuf bytes for substrings. `gen-tonic-messages` is the prost
# message half without the tonic transport, which is all a decoder needs.
#
# A test-only dependency, and allowed to be: the ownership decision confines
# exporters and their vocabulary to `examples/` and `tests/`, and this is the
# `tests/` half. Already in the tree behind `opentelemetry-otlp`, so it adds no
# compilation that was not happening anyway.
opentelemetry-proto = { version = "0.32", default-features = false, features = [
    "gen-tonic-messages",
    "logs",
    "metrics",
    "trace",
] }
prost = "0.14"
# The capture server `otlp_wire` used to carry privately. Shared since the
# example telemetry gate needed the same thing, and a second hand-rolled HTTP
# capture server is how two subtly different ones appear.
otlp-capture = { path = "../otlp-capture" }
# An HTTP client, because the point of `admin_http` is the hop the router-level
# tests skip. Already in the tree behind the OTLP exporter, so it costs nothing
# to compile.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde_json.workspace = true
uuid.workspace = true

[lints]
workspace = true
