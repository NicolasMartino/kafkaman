[package]
name = "otlp-capture"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The OTLP wire types, so a caller can decode what it captured instead of
# searching protobuf bytes for substrings. `gen-tonic-messages` is the prost
# message half without the tonic transport, which is all a decoder needs.
#
# Under `tests/` rather than `crates/` on purpose: the ownership decision
# confines exporters and their vocabulary to `examples/` and `tests/`, and both
# callers of this crate are test suites.
opentelemetry-proto = { version = "0.32", default-features = false, features = [
    "gen-tonic-messages",
    "logs",
    "metrics",
    "trace",
] }
prost = "0.14"

[lints]
workspace = true
